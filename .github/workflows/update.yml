name: Daily update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Прерванный посреди git push прогон — сорванный деплой: коммит public/ в main
# и есть деплой (Timeweb Apps выкладывает его автоматически), поэтому не отменяем
concurrency:
  group: update
  cancel-in-progress: false

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests

      - name: Fetch records
        run: python scripts/fetch.py

      # Сборку гоняем всегда: данные могли не измениться, но код — мог
      - name: Build site
        run: python scripts/build.py

      # Коммит public/ — это и есть деплой: Timeweb Apps (static-nobuild,
      # index_dir=/public) пересобирает сайт по вебхуку на каждый push в main
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/junior.json public README.md
          # Без этой проверки шаг падает на пустом коммите: fetch.py намеренно
          # не трогает json, когда данные не изменились
          if git diff --cached --quiet; then
            echo "нечего коммитить"
          else
            git commit -m "data: update records $(date -u +%Y-%m-%d)"
            git push
          fi
